name: Daily tracker
on:
  schedule:
    - cron: '15 22 * * *'
    - cron: '40 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: daily-tracker
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether today's scheduled run already succeeded
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os, pathlib
          path = pathlib.Path('data/status.json')
          status = json.loads(path.read_text()) if path.exists() else {}
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          skip = (os.environ['EVENT_NAME'] == 'schedule' and status.get('run_time', '')[:10] == today and status.get('trigger') == 'schedule' and status.get('items', 0) > 0)
          print('skip=' + str(skip).lower())
          PY
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: '3.11'
      - name: Install test dependencies
        if: steps.check.outputs.skip != 'true'
        run: python -m pip install pytest
      - name: Fetch and rebuild
        if: steps.check.outputs.skip != 'true'
        run: python pipeline.py run
      - name: Test updated data and code
        if: steps.check.outputs.skip != 'true'
        run: python -m pytest -q
      - name: Update daily issue
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python issue.py
      - name: Commit daily data
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update daily market data $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Run tests on the data commit
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref main
      - name: Publish updated data
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
